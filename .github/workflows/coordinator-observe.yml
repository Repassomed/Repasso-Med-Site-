name: Repasso Coordinator (OBSERVE)

# Coordinator V2 — Issue #95. Modo OBSERVE, sem chamada paga.
#
# TRAVA EM VÁRIAS CAMADAS, de propósito:
#   1. este workflow inteiro só roda quando a Variable do repositório
#      REPASSO_COORDINATOR_ENABLED é exatamente "true" (condição do job,
#      abaixo) — enquanto for "false" (o valor de hoje), o job nem começa,
#      então NENHUM segundo de runner é gasto e NENHUM código roda;
#   2. mesmo que o job rodasse, coordinator/config.py consulta a mesma
#      variável (e MODE) de novo e recusa qualquer chamada externa se o
#      portão não abrir. Ver coordinator/config.py;
#   3. um evento issue_comment só passa da camada 1 se o autor do
#      comentário for um ator confiável (ver o `if:` do job) — e
#      coordinator/github_event.py checa a MESMA regra de novo em código
#      (ALLOWED_COMMENT_ACTORS), nunca confiando só no `if:` do workflow;
#   4. enquanto REPASSO_COORDINATOR_PILOT=true, só o evento explicitamente
#      autorizado (REPASSO_COORDINATOR_PILOT_EVENT_KEY) pode gerar uma
#      chamada — ver Config.pilot_allows em coordinator/config.py.
#
# Isto respeita ao pé da letra a Issue #95: "Enquanto ENABLED=false:
# nenhuma chamada paga; nenhum Coordinator API roda."
#
# Eventos que este workflow observa (Issue #95, "PRIMEIRO ALVO"):
#   1. PR chega a NEEDS-AUDIT          (workflow_run do Guard + rótulo real da PR)
#   2. checkpoint BLOCKED-LIMIT        (issue_comment: created, de ator confiável)
#   3. comentário novo na Issue #88    (issue_comment: created, de ator confiável)
#   4. Guard muda de estado            (workflow_run: completed, "Repasso Guard")
#
# ─────────────────────────────────────────────────────────────────────────
# BLOQUEADOR 1 da 3ª auditoria (PR #97) — TRUSTED EXECUTION COM SECRETS.
#
# Antes desta correção, este workflow tinha um trigger `pull_request:
# labeled` direto. Para um PR do MESMO repositório (não de fork), o
# GitHub Actions roda o ARQUIVO deste workflow na versão do PR/merge
# commit daquele evento — não só o checkout, o workflow inteiro. Como
# secrets NÃO são restritos para PRs do mesmo repositório (só para forks),
# um PR que alterasse `coordinator/**`, `requirements.txt` ou este próprio
# arquivo poderia, em tese, rodar código de sua autoria com
# ANTHROPIC_API_KEY/GITHUB_TOKEN(write) expostos — a mesma classe de
# problema que o Guard já fecha para si mesmo (ver o comentário no topo de
# `.github/workflows/guard.yml`), agora com segredo real em jogo.
#
# Correção: o trigger `pull_request` foi REMOVIDO deste workflow. Os dois
# triggers que sobraram são estruturalmente seguros:
#   - `workflow_run` SEMPRE usa o arquivo de workflow e o código da branch
#     PADRÃO do repositório, nunca o do PR que originou a execução
#     observada — é uma garantia da própria plataforma GitHub Actions,
#     documentada exatamente para este caso;
#   - `issue_comment` não carrega nenhum ref de PR para o `actions/
#     checkout` resolver por padrão — mas, por defesa em profundidade
#     (nunca confiar só na omissão), o passo de checkout abaixo fixa
#     EXPLICITAMENTE `ref: <branch padrão>`, então mesmo que o
#     comportamento padrão do GitHub mudasse, o código executado aqui
#     nunca seria o de um PR.
#
# O evento PR_NEEDS_AUDIT (que antes vinha do payload `pull_request`
# bruto) agora é sintetizado a partir de `workflow_run` + uma leitura
# somente-leitura da PR via API (não é execução de código — é dado),
# feita por um passo deste MESMO job (portanto já rodando a partir da
# branch padrão). Ver coordinator/github_event.py.
#
# BLOQUEADOR 2 — atores confiáveis em issue_comment: ver o `if:` do job.
# BLOQUEADOR 3 — modo PILOTO: ver REPASSO_COORDINATOR_PILOT no passo
#   "Rodar o Coordinator" e coordinator/config.py.
# BLOQUEADOR 4 — Worker Registry real: --workers-from-tasks-json abaixo.
# BLOQUEADOR 5 — audit-pack real do Guard: passo "Baixar o audit-pack".
# BLOQUEADOR 6 — dedup do Guard por estado, não run_id: ver
#   coordinator/github_event.py (`dedup_fields={"conclusion": ...}`).
# BLOQUEADOR 7 — erro do CLI deixa o job vermelho: último passo abaixo.
# BLOQUEADOR 8 — saída humana honesta sobre chamada/usage/custo: ver
#   coordinator/__main__.py::render_human.
#
# Escopo desta entrega (não escondido, só explícito): o resultado OBSERVE
# vai para o log do job e para um artifact — este workflow NÃO comenta
# automaticamente no PR/Issue ainda (decisão futura separada, já registrada
# na 2ª auditoria).
#
# ─────────────────────────────────────────────────────────────────────────
# V3 (Issue #99) — "coordenação ativa supervisionada".
#
# ``REPASSO_COORDINATOR_MODE=active-supervised`` (aditivo — produção
# continua em ``observe`` até José decidir trocar) liga uma segunda
# capacidade: auditoria semântica STANDARD independente para conteúdo
# Nível C (área=="materia", Issue #83) e, quando ela produz um Cartão de
# Merge, um comentário automático no PR — SEMPRE só um comentário/estado
# operacional, NUNCA merge, NUNCA edição de matéria/Supabase/produção,
# NUNCA force-push, NUNCA aumento de orçamento (ver
# coordinator/observe.py, coordinator/audit.py, coordinator/merge_card.py
# e as proibições absolutas documentadas em coordinator/audit.py::
# AUDIT_SYSTEM_PROMPT). O passo "Comentar o Cartão de Merge" abaixo só
# publica quando o CLI de fato gravou ``--comment-out`` — nunca comenta
# um resultado vazio.
#
# SEGURANÇA ANTES DE AUMENTAR PERMISSÕES (Issue #99): ``issues: write``
# abaixo é a única permissão nova desta V3, e só é usada para postar um
# comentário — nunca para fechar/reabrir/rotular. ``main`` continua sem
# nenhuma regra de proteção de branch/Ruleset (nenhum workflow deste
# repositório tenta configurar isso via API — está fora do escopo de
# permissões do Coordinator, privilégio mínimo). ``.github/CODEOWNERS``
# (novo nesta V3) existe só como estrutura/documentação futura — a
# auditoria independente do PR #104 (achado B3) recomendou explicitamente
# NÃO ativar "Require review from Code Owners" agora, porque José e todos
# os agentes Claude publicam pela MESMA identidade GitHub ("Repassomed"),
# o que tornaria isso uma auto-revisão sem sentido. O passo manual que
# falta é mais simples e cabe só a José, em Settings → Branches/Rulesets:
# uma regra para "main" exigindo Pull Request, bloqueando force-push e
# exigindo que os checks passem — com 0 approvals exigidas por enquanto.

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Repasso Guard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: repasso-coordinator-observe-${{ github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  observe:
    # Camada 1 do portão: enquanto a Variable não for exatamente "true",
    # o job não roda. Nada de runner, nada de Python, nada de custo.
    #
    # Camada 3 (bloqueador 2): um issue_comment só passa se o autor do
    # comentário for um ator confiável deste projeto — hoje José e todos
    # os agentes Claude publicam pela MESMA identidade do GitHub
    # ("Repassomed"), então esta é a lista completa. Um comentário de
    # QUALQUER outro autor nem chega a receber secret. Isto espelha
    # coordinator.github_event.ALLOWED_COMMENT_ACTORS — mudar um sem o
    # outro quebra a simetria, então os dois precisam ser lidos juntos.
    # workflow_run não precisa desta checagem: ele não é acionado por
    # texto de terceiros, é o próprio Guard terminando.
    #
    # Camada 4 (anti-self-loop em duas camadas — achado B5 da auditoria
    # independente do PR #104, rodada 2): o filtro em Python
    # (github_event.py::COORDINATOR_COMMENT_MARKER, antes de dedup/API) já
    # bastava para nunca gerar cobrança recursiva, mas deixava o job
    # inteiro (checkout, Python, secret exposto ao runner) rodar à toa
    # para um comentário que o próprio Coordinator publicou — custo de
    # Actions e superfície desnecessária. Esta camada extra nem deixa o
    # job começar quando o comentário já contém o marcador; o filtro
    # Python continua como segunda camada (defesa em profundidade, nunca
    # confiar só no `if:` do workflow).
    if: >
      vars.REPASSO_COORDINATOR_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' ||
        (github.event.comment.user.login == 'Repassomed' &&
         !contains(github.event.comment.body, '<!-- repasso-coordinator -->')))
    runs-on: ubuntu-latest
    # contents:write só é usado para publicar a branch de estado dedicada
    # (coordinator-state-*, nunca 'main', nunca matéria — ver
    # coordinator/git_state.py e o teste que prova isso estruturalmente).
    # pull-requests:read só é usado para ler (nunca escrever) o rótulo e o
    # corpo da PR associada a um workflow_run do Guard — dado, não código.
    # actions:read é exigido pelo GitHub para baixar artifact de OUTRA
    # execução (actions/download-artifact@v4 com run-id do workflow_run
    # observado, abaixo) — achado do "ACHADO ADICIONAL" e do "PACOTE
    # CONSOLIDADO" (PR #97): permissão omitida vira 'none', então sem isto
    # o passo de baixar o audit-pack do Guard pode falhar em produção
    # mesmo com os testes estruturais verdes. Deliberadamente só :read —
    # este job nunca cria nem apaga artifact, só consome o que o Guard já
    # publicou (ver test_actions_read_present_actions_write_absent).
    permissions:
      actions: read
      contents: write
      pull-requests: read
      # V3 (Issue #99) — só para postar o Cartão de Merge como comentário
      # quando a auditoria ativa-supervisionada produzir um (ver o passo
      # "Comentar o Cartão de Merge" abaixo). Nunca usado para fechar,
      # reabrir, rotular ou apagar nada — privilégio mínimo.
      issues: write
    steps:
      - name: Checkout (SEMPRE a branch padrão — nunca o HEAD de um PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirmar os portões em código (camada 2, defesa em profundidade)
        env:
          REPASSO_COORDINATOR_ENABLED: ${{ vars.REPASSO_COORDINATOR_ENABLED }}
          REPASSO_COORDINATOR_MODE: ${{ vars.REPASSO_COORDINATOR_MODE }}
          REPASSO_COORDINATOR_PILOT: ${{ vars.REPASSO_COORDINATOR_PILOT }}
        run: |
          python3 -c "
          from coordinator.config import Config
          cfg = Config.from_env()
          gate = cfg.gate()
          print(f'Portão ENABLED/MODE: {\"ABERTO\" if gate.open else \"FECHADO\"} — {gate.reason}')
          print(f'Modo PILOTO: {\"ATIVO\" if cfg.pilot else \"inativo\"}')
          "

      - name: Instalar o SDK da Anthropic (só dentro deste job condicionado)
        run: pip install -q -r coordinator/requirements.txt

      - name: Buscar dados reais da PR associada (só leitura — bloqueador 1/5)
        id: prctx
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              console.log('workflow_run sem PR associada (mesmo repositório) — nada a buscar.');
              return;
            }
            const numero = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: numero,
            });
            fs.writeFileSync('/tmp/pr-info.json', JSON.stringify({
              number: pr.number,
              title: pr.title,
              body: pr.body,
              labels: pr.labels.map(l => l.name),
              updated_at: pr.updated_at,
            }));
            console.log(`PR #${numero}: rótulos = ${pr.labels.map(l => l.name).join(', ')}`);

            // Correção B2 da auditoria independente do PR #104: o corpo da
            // PR é a declaração do worker, nunca prova do que mudou. Este
            // passo já roda com o código confiável da branch padrão (nunca
            // o HEAD do PR — ver o comentário no topo do arquivo); busca o
            // diff REAL (texto puro, formato "diff") e escreve em arquivo
            // próprio para o CLI ler via --pr-diff-file. O texto nunca é
            // executado por este script nem por coordinator/**, só
            // atravessa como dado até o prompt da auditoria — nunca
            // segredo, nunca código deste repositório.
            const diffResp = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: numero,
              mediaType: { format: 'diff' },
            });
            const diffTexto = typeof diffResp.data === 'string' ? diffResp.data : '';
            fs.writeFileSync('/tmp/pr-diff.patch', diffTexto);
            console.log(`Diff real da PR #${numero}: ${diffTexto.length} caracteres (truncamento por tamanho/custo acontece do lado do Coordinator, em coordinator/audit.py::preparar_diff).`);

      - name: Baixar o audit-pack real do Guard (artifact do run observado)
        if: github.event_name == 'workflow_run'
        continue-on-error: true # run antigo/sem artifact não pode derrubar o job
        uses: actions/download-artifact@v4
        with:
          name: repasso-guard-audit-pack
          path: /tmp/guard-audit-pack
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rodar o Coordinator sobre o evento real
        id: coordinator
        env:
          # Único lugar que a chave existe: o GitHub Secret, exposto só
          # como variável de ambiente deste passo — nunca em código, nunca
          # logada (coordinator/anthropic_transport.py só lê de env, e
          # coordinator/redact.py sanitiza qualquer eco em erro).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Os portões precisam chegar até AQUI — é este passo que de fato
          # chama Config.from_env() dentro de `python3 -m coordinator`.
          # Passo de verificação acima lê as mesmas Variables só para
          # imprimir; sem repetir aqui, o processo real veria os defaults
          # seguros (false/observe) mesmo que José tivesse ligado de
          # verdade — o que tornaria o primeiro teste real impossível.
          REPASSO_COORDINATOR_ENABLED: ${{ vars.REPASSO_COORDINATOR_ENABLED }}
          REPASSO_COORDINATOR_MODE: ${{ vars.REPASSO_COORDINATOR_MODE }}
          REPASSO_COORDINATOR_PILOT: ${{ vars.REPASSO_COORDINATOR_PILOT }}
          REPASSO_COORDINATOR_PILOT_EVENT_KEY: ${{ vars.REPASSO_COORDINATOR_PILOT_EVENT_KEY }}
        run: |
          set +e
          # Remoto com o GITHUB_TOKEN embutido, só para dar push na branch
          # de estado dedicada (contents:write acima). O GitHub mascara
          # automaticamente qualquer log que contenha secrets.GITHUB_TOKEN;
          # como reforço adicional, qualquer erro de git que ecoasse esta
          # URL também passa por coordinator/redact.py antes de aparecer em
          # qualquer resultado (ver test_redact_masks_url_embedded_credential).
          REMOTO_COM_TOKEN="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          ARGS=(
            --github-event-name "${{ github.event_name }}"
            --event "${{ github.event_path }}"
            --repo "${{ github.repository }}"
            --dedup-git-remote "$REMOTO_COM_TOKEN"
            --usage-git-remote "$REMOTO_COM_TOKEN"
            --workers-from-tasks-json coordination/tasks.json
            --worker-state-git-remote "$REMOTO_COM_TOKEN"
            --out /tmp/coordinator-observe.json
            --comment-out /tmp/coordinator-comment.md
            --comment-target-out /tmp/coordinator-comment-target.txt
          )
          [ -f /tmp/pr-info.json ] && ARGS+=(--pr-info-file /tmp/pr-info.json)
          [ -f /tmp/guard-audit-pack/guard-audit-pack.json ] && ARGS+=(--guard-audit-pack /tmp/guard-audit-pack/guard-audit-pack.json)
          [ -s /tmp/pr-diff.patch ] && ARGS+=(--pr-diff-file /tmp/pr-diff.patch)

          python3 -m coordinator "${ARGS[@]}"
          echo "resultado=$?" >> "$GITHUB_OUTPUT"

          # Correção B1 da auditoria independente do PR #104, rodada 4:
          # a função hashFiles() (linguagem de expressão do Actions) só
          # enxerga arquivos dentro de GITHUB_WORKSPACE — /tmp fica FORA
          # disso, então usá-la contra um caminho de /tmp no `if:` do passo
          # seguinte avaliaria sempre como string vazia em produção
          # (comentário nunca seria publicado, apesar de todos os testes
          # locais/estruturais passarem, já que nenhum deles executa um
          # runner real do Actions). O bash comum, ao contrário dessa
          # função, lê /tmp sem problema — então é aqui, ainda em bash, que
          # a existência dos dois arquivos é checada e publicada como
          # output explícito para o próximo passo consultar.
          if [ -s /tmp/coordinator-comment.md ] && [ -s /tmp/coordinator-comment-target.txt ]; then
            echo "comment_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar o resultado OBSERVE como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repasso-coordinator-observe
          path: /tmp/coordinator-observe.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Comentar o Cartão de Merge/checkpoint (V3, Issue #99)
        # Só existe quando o CLI de fato gravou --comment-out E
        # --comment-target-out juntos (MODE=active-supervised e o evento
        # produziu um Cartão de Merge/checkpoint COM destino conhecido —
        # ver coordinator/observe.py). Em MODE=observe (produção hoje)
        # nenhum dos dois arquivos é criado, então este passo é sempre
        # pulado — comportamento V2 inalterado.
        #
        # Correção B4 da auditoria independente do PR #104, rodada 4: o
        # destino NUNCA é inferido aqui — o Coordinator já decidiu (ex.:
        # um POOL-PAUSADO sempre vai para a Inbox #88, mesmo quando o
        # checkpoint que o disparou chegou em outra issue; um checkpoint
        # específico volta para a issue de origem; um Cartão de Merge vai
        # para a PR) e gravou o número em
        # /tmp/coordinator-comment-target.txt. Este passo só lê esse
        # arquivo — nunca reconstrói a lógica de destino em JavaScript.
        #
        # Correção B1 da auditoria independente do PR #104, rodada 4: a
        # função hashFiles() do Actions não enxerga /tmp (fica fora de
        # GITHUB_WORKSPACE) — o `if:` abaixo antes chamava essa função
        # contra um caminho de /tmp e por isso provavelmente NUNCA era
        # verdadeiro em produção. Agora o `if:` consulta o output explícito
        # `comment_ready`, gravado em bash pelo passo "Rodar o Coordinator"
        # (bash lê /tmp normalmente — só aquela função da linguagem de
        # expressão do Actions é restrita ao workspace). `fs.existsSync`
        # abaixo continua como segunda camada de segurança dentro do
        # próprio script.
        if: always() && steps.coordinator.outputs.comment_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/coordinator-comment.md') || !fs.existsSync('/tmp/coordinator-comment-target.txt')) {
              console.log('Arquivo de comentário/destino ausente apesar de comment_ready=true — nada publicado.');
              return;
            }
            const corpo = fs.readFileSync('/tmp/coordinator-comment.md', 'utf8');
            const issueNumber = parseInt(fs.readFileSync('/tmp/coordinator-comment-target.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(issueNumber)) {
              console.log('Destino do comentário inválido/ilegível — nada publicado.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: corpo,
            });
            console.log(`Comentário publicado na issue/PR #${issueNumber}.`);

      - name: Falhar o job se o Coordinator terminou com erro (bloqueador 7)
        if: steps.coordinator.outputs.resultado != '0'
        run: |
          echo "O Coordinator terminou com código ${{ steps.coordinator.outputs.resultado }} — ver o artifact/log publicado acima."
          exit 1
