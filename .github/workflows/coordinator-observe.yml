name: Repasso Coordinator (OBSERVE)

# Coordinator V2 — Issue #95. Modo OBSERVE, sem chamada paga.
#
# TRAVA EM VÁRIAS CAMADAS, de propósito:
#   1. este workflow inteiro só roda quando a Variable do repositório
#      REPASSO_COORDINATOR_ENABLED é exatamente "true" (condição do job,
#      abaixo) — enquanto for "false" (o valor de hoje), o job nem começa,
#      então NENHUM segundo de runner é gasto e NENHUM código roda;
#   2. mesmo que o job rodasse, coordinator/config.py consulta a mesma
#      variável (e MODE) de novo e recusa qualquer chamada externa se o
#      portão não abrir. Ver coordinator/config.py;
#   3. um evento issue_comment só passa da camada 1 se o autor do
#      comentário for um ator confiável (ver o `if:` do job) — e
#      coordinator/github_event.py checa a MESMA regra de novo em código
#      (ALLOWED_COMMENT_ACTORS), nunca confiando só no `if:` do workflow;
#   4. enquanto REPASSO_COORDINATOR_PILOT=true, só o evento explicitamente
#      autorizado (REPASSO_COORDINATOR_PILOT_EVENT_KEY) pode gerar uma
#      chamada — ver Config.pilot_allows em coordinator/config.py.
#
# Isto respeita ao pé da letra a Issue #95: "Enquanto ENABLED=false:
# nenhuma chamada paga; nenhum Coordinator API roda."
#
# Eventos que este workflow observa (Issue #95, "PRIMEIRO ALVO"):
#   1. PR chega a NEEDS-AUDIT          (workflow_run do Guard + rótulo real da PR)
#   2. checkpoint BLOCKED-LIMIT        (issue_comment: created, de ator confiável)
#   3. comentário novo na Issue #88    (issue_comment: created, de ator confiável)
#   4. Guard muda de estado            (workflow_run: completed, "Repasso Guard")
#
# ─────────────────────────────────────────────────────────────────────────
# BLOQUEADOR 1 da 3ª auditoria (PR #97) — TRUSTED EXECUTION COM SECRETS.
#
# Antes desta correção, este workflow tinha um trigger `pull_request:
# labeled` direto. Para um PR do MESMO repositório (não de fork), o
# GitHub Actions roda o ARQUIVO deste workflow na versão do PR/merge
# commit daquele evento — não só o checkout, o workflow inteiro. Como
# secrets NÃO são restritos para PRs do mesmo repositório (só para forks),
# um PR que alterasse `coordinator/**`, `requirements.txt` ou este próprio
# arquivo poderia, em tese, rodar código de sua autoria com
# ANTHROPIC_API_KEY/GITHUB_TOKEN(write) expostos — a mesma classe de
# problema que o Guard já fecha para si mesmo (ver o comentário no topo de
# `.github/workflows/guard.yml`), agora com segredo real em jogo.
#
# Correção: o trigger `pull_request` foi REMOVIDO deste workflow. Os dois
# triggers que sobraram são estruturalmente seguros:
#   - `workflow_run` SEMPRE usa o arquivo de workflow e o código da branch
#     PADRÃO do repositório, nunca o do PR que originou a execução
#     observada — é uma garantia da própria plataforma GitHub Actions,
#     documentada exatamente para este caso;
#   - `issue_comment` não carrega nenhum ref de PR para o `actions/
#     checkout` resolver por padrão — mas, por defesa em profundidade
#     (nunca confiar só na omissão), o passo de checkout abaixo fixa
#     EXPLICITAMENTE `ref: <branch padrão>`, então mesmo que o
#     comportamento padrão do GitHub mudasse, o código executado aqui
#     nunca seria o de um PR.
#
# O evento PR_NEEDS_AUDIT (que antes vinha do payload `pull_request`
# bruto) agora é sintetizado a partir de `workflow_run` + uma leitura
# somente-leitura da PR via API (não é execução de código — é dado),
# feita por um passo deste MESMO job (portanto já rodando a partir da
# branch padrão). Ver coordinator/github_event.py.
#
# BLOQUEADOR 2 — atores confiáveis em issue_comment: ver o `if:` do job.
# BLOQUEADOR 3 — modo PILOTO: ver REPASSO_COORDINATOR_PILOT no passo
#   "Rodar o Coordinator" e coordinator/config.py.
# BLOQUEADOR 4 — Worker Registry real: --workers-from-tasks-json abaixo.
# BLOQUEADOR 5 — audit-pack real do Guard: passo "Baixar o audit-pack".
# BLOQUEADOR 6 — dedup do Guard por estado, não run_id: ver
#   coordinator/github_event.py (`dedup_fields={"conclusion": ...}`).
# BLOQUEADOR 7 — erro do CLI deixa o job vermelho: último passo abaixo.
# BLOQUEADOR 8 — saída humana honesta sobre chamada/usage/custo: ver
#   coordinator/__main__.py::render_human.
#
# Em active-supervised, o resultado da auditoria de conteúdo é publicado
# também como Cartão de Merge na própria PR. O comentário é só um parecer:
# nunca faz merge, deploy, label, close/reopen nem altera a branch da tarefa.
#
# ─────────────────────────────────────────────────────────────────────────
# V3 (Issue #99) — "coordenação ativa supervisionada".
#
# ``REPASSO_COORDINATOR_MODE=active-supervised`` (aditivo — produção
# continua em ``observe`` até José decidir trocar) liga uma segunda
# capacidade: auditoria semântica STANDARD independente para conteúdo
# Nível C (área=="materia", Issue #83) e, quando ela produz um Cartão de
# Merge, um comentário automático no PR — SEMPRE só um comentário/estado
# operacional, NUNCA merge, NUNCA edição de matéria/Supabase/produção,
# NUNCA force-push, NUNCA aumento de orçamento (ver
# coordinator/observe.py, coordinator/audit.py, coordinator/merge_card.py
# e as proibições absolutas documentadas em coordinator/audit.py::
# AUDIT_SYSTEM_PROMPT). O passo "Comentar o Cartão de Merge" abaixo só
# publica quando o CLI de fato gravou ``--comment-out`` — nunca comenta
# um resultado vazio.
#
# SEGURANÇA ANTES DE AUMENTAR PERMISSÕES (Issue #99): ``issues: write``
# e ``pull-requests: write`` ficam restritos ao job confiável ``observe``
# e são usados somente para postar o Cartão de Merge como comentário —
# nunca para merge, fechar/reabrir, rotular ou alterar branch. ``main`` continua sem
# nenhuma regra de proteção de branch/Ruleset (nenhum workflow deste
# repositório tenta configurar isso via API — está fora do escopo de
# permissões do Coordinator, privilégio mínimo). ``.github/CODEOWNERS``
# (novo nesta V3) existe só como estrutura/documentação futura — a
# auditoria independente do PR #104 (achado B3) recomendou explicitamente
# NÃO ativar "Require review from Code Owners" agora, porque José e todos
# os agentes Claude publicam pela MESMA identidade GitHub ("Repassomed"),
# o que tornaria isso uma auto-revisão sem sentido. O passo manual que
# falta é mais simples e cabe só a José, em Settings → Branches/Rulesets:
# uma regra para "main" exigindo Pull Request, bloqueando force-push e
# exigindo que os checks passem — com 0 approvals exigidas por enquanto.
#
# ─────────────────────────────────────────────────────────────────────────
# OPENAI AUDITOR (Issue #106) — aval final independente de conteúdo.
#
# A OpenAI Responses API (``store=false`` sempre — ver
# coordinator/openai_transport.py) audita o MESMO checkpoint de conteúdo
# médico/didático Nível C depois da Anthropic (nunca é um gatilho novo).
# Em produção, ``REPASSO_OPENAI_AUDITOR_ENABLED=true`` habilita a chamada;
# o código continua fail-closed e reconfirma o portão separado em
# coordinator/openai_config.py::
# OpenAIAuditorConfig.gate(), checado de novo em ``openai_client.call``
# antes de qualquer chamada, junto com um hard stop de orçamento interno —
# nunca confiar só no cap externo do dashboard da OpenAI). O
# ``OPENAI_API_KEY`` segue a MESMA trava do ``ANTHROPIC_API_KEY``: só existe
# como env do passo confiável abaixo (branch padrão, nunca o HEAD de um
# PR). O ledger de custo do OpenAI Auditor é uma branch de estado SEPARADA
# (``coordinator-state-usage-openai``, nunca a mesma do ledger Anthropic).
# O Worker Registry operacional continua registrando ``chatgpt-auditor``
# como ``OFFLINE``/``can_execute=false`` — esta PR não muda isso.
#
# ─────────────────────────────────────────────────────────────────────────
# F8-A (Issue #105, Fase F, 7ª rodada) — LIGA o caminho REAL do Worker
# Runner a este workflow: um comando ``SET_AVAILABLE`` reconhecido na
# Inbox (#88) já sabe REAGIR (achado F7-A, `coordinator/__main__.py`
# repassa `runner_tasks_json_path`/`runner_repo_dir`/`runner_dispatch_
# config`/`runner_state_git_remote` para `observe()`), mas até esta
# correção nada os alimentava com um `--runner-repo-dir` real nem com as
# MESMAS Variables que `coordinator-runner.yml` já usa — então
# `RunnerDispatchConfig.from_env()` sempre via os defaults seguros
# (ENABLED=false), e nenhuma retomada `api_runner` de verdade seria
# despachada por este caminho, mesmo com o Worker Runner ligado.
#
# Esta correção só ADICIONA `--runner-repo-dir .` ao comando do passo
# "Rodar o Coordinator" e disponibiliza, no MESMO passo, as MESMAS 5
# Variables/expressões que `coordinator-runner.yml` já usa para o Runner
# — nenhuma flag nova é ligada por conta própria aqui: o valor de
# `REPASSO_RUNNER_ENABLED` continua "false" (produção hoje) até José
# decidir mudar a Variable do repositório, e as regras de segurança
# (REF==default_branch, MODE=="canary", CANARY_TASK_ID configurado) são
# as MESMAS que `RunnerDispatchConfig.gate()` já impõe — reconfirmadas em
# código, nunca reimplementadas aqui:
#   - REPASSO_RUNNER_ENABLED         (mesma Variable do Runner)
#   - REPASSO_RUNNER_MODE            (mesma Variable do Runner)
#   - REPASSO_RUNNER_CANARY_TASK_ID  (mesma Variable do Runner)
#   - REPASSO_RUNNER_ACTUAL_REF      (mesma expressão do Runner: github.ref)
#   - REPASSO_RUNNER_EXPECTED_REF    (mesma expressão do Runner:
#                                      refs/heads/<default_branch>)
# Este job (`observe`) continua sem `workflow_dispatch`/sem o `if:` de
# ator+ref do Runner — não é o mesmo mecanismo de disparo, e uma retomada
# `api_runner` só acontece de fato quando TODOS os portões acima abrem em
# código (RunnerDispatchConfig.gate(), dentro de `despachar_retomada`),
# nunca só por este job ter rodado.
# ─────────────────────────────────────────────────────────────────────────

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Repasso Guard"]
    types: [completed]
  # Issue #259 — dispatch explícito do PRÓPRIO Guard (passo "Acionar o
  # OBSERVE explicitamente" em guard.yml), porque um workflow_run
  # disparado com o GITHUB_TOKEN automático (Heartbeat -> Guard, ou o
  # próprio gatilho comum do Guard sobre uma PR) não aciona o listener
  # `workflow_run` acima — restrição documentada de anti-recursão do
  # GITHUB_TOKEN (ver o
  # comentário no passo de guard.yml). O `workflow_run` acima continua
  # exatamente como estava, sem nenhuma mudança: os dois gatilhos convivem
  # de propósito — o segundo é rede de segurança para quando o primeiro
  # não fica marcado pelo GITHUB_TOKEN; nunca duplicam custo porque a
  # mesma identidade HEAD+policy do dedup existente decide isso (ver o
  # passo "Rodar o Coordinator" abaixo — os dois caminhos convergem para
  # o MESMO `_from_workflow_run`).
  workflow_dispatch:
    inputs:
      guard_run_id:
        description: "run_id numérico da execução do Repasso Guard que terminou (só dígitos)"
        required: true
        type: string
  # Heartbeat em coordinator-guard-heartbeat.yml (workflow independente).

permissions:
  contents: read

concurrency:
  group: >-
    repasso-coordinator-observe-${{
      github.event.issue.number || github.event.workflow_run.id || inputs.guard_run_id
    }}
  cancel-in-progress: true

jobs:
  observe:
    # Camada 1 do portão: enquanto a Variable não for exatamente "true",
    # o job não roda. Nada de runner, nada de Python, nada de custo.
    #
    # Camada 3 (bloqueador 2): um issue_comment só passa se o autor do
    # comentário for um ator confiável deste projeto — hoje José e todos
    # os agentes Claude publicam pela MESMA identidade do GitHub
    # ("Repassomed"), então esta é a lista completa. Um comentário de
    # QUALQUER outro autor nem chega a receber secret. Isto espelha
    # coordinator.github_event.ALLOWED_COMMENT_ACTORS — mudar um sem o
    # outro quebra a simetria, então os dois precisam ser lidos juntos.
    # workflow_run não precisa desta checagem: ele não é acionado por
    # texto de terceiros, é o próprio Guard terminando.
    #
    # Camada 4 (anti-self-loop em duas camadas — achado B5 da auditoria
    # independente do PR #104, rodada 2): o filtro em Python
    # (github_event.py::COORDINATOR_COMMENT_MARKER, antes de dedup/API) já
    # bastava para nunca gerar cobrança recursiva, mas deixava o job
    # inteiro (checkout, Python, secret exposto ao runner) rodar à toa
    # para um comentário que o próprio Coordinator publicou — custo de
    # Actions e superfície desnecessária. Esta camada extra nem deixa o
    # job começar quando o comentário já contém o marcador; o filtro
    # Python continua como segunda camada (defesa em profundidade, nunca
    # confiar só no `if:` do workflow).
    #
    # Camada 5 (tempestade de execuções, 24/09/2026): o Python só cria
    # evento para comentário na Inbox (#88, INBOX_COMMENT/comandos de
    # worker) ou com linha "ESTADO:" (checkpoint BLOCKED-LIMIT). Qualquer
    # outro comentário — status de agente em PR/issue — terminava em
    # "nenhum evento" DEPOIS de subir o job inteiro, e o OBSERVE "success"
    # ainda acordava um Worker Bridge. Medido: 9 de 9 OBSERVE por
    # comentário numa janela de 20 min eram desse tipo. Este filtro é um
    # SUPERCONJUNTO do filtro Python (contains 'ESTADO:' ⊇ ^ESTADO:), então
    # nunca descarta um evento legítimo; o Python continua decidindo.
    #
    # Camada 6: Guard cancelled/skipped/action_required não é veredito
    # (concurrency do Guard cancela o run anterior a cada push; PR do bot
    # fica em action_required). Antes virava "failure" e abria Issue falsa
    # de HARD FAIL; espelha github_event.GUARD_CONCLUSOES_SEM_VEREDITO.
    #
    # Camada 7 (Issue #259): o caminho workflow_dispatch só existe para o
    # PRÓPRIO guard.yml acionar (passo "Acionar o OBSERVE explicitamente")
    # — nunca um "Run workflow" manual com run_id arbitrário. Diferente do
    # `workflow_run` acima, aqui NÃO dá para checar a conclusão do Guard
    # neste `if:` (exigiria uma chamada de API, só possível dentro de um
    # passo) — o equivalente à Camada 6 para este caminho é feito em
    # código, dentro de `coordinator/github_event.py::_from_workflow_run`,
    # que já filtra a MESMA lista `GUARD_CONCLUSOES_SEM_VEREDITO` (ver o
    # passo "Resolver a execução do Guard observada" abaixo, que entrega
    # exatamente o mesmo formato de payload que o caminho workflow_run já
    # entregava). Continua defesa em profundidade — só a camada muda de
    # lugar, nunca desaparece.
    if: >
      github.event_name != 'schedule' &&
      vars.REPASSO_COORDINATOR_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' ||
        (github.event.comment.user.login == 'Repassomed' &&
         !contains(github.event.comment.body, '<!-- repasso-coordinator -->') &&
         (github.event.issue.number == 88 ||
          contains(github.event.comment.body, 'ESTADO:')))) &&
      (github.event_name != 'workflow_run' ||
        !contains(fromJSON('["cancelled","skipped","action_required","neutral","stale"]'),
                  github.event.workflow_run.conclusion)) &&
      (github.event_name != 'workflow_dispatch' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    # contents:write só é usado para publicar a branch de estado dedicada
    # (coordinator-state-*, nunca 'main', nunca matéria — ver
    # coordinator/git_state.py e o teste que prova isso estruturalmente).
    # pull-requests:write é necessário porque o Cartão de Merge é publicado
    # como comentário numa PR. Em produção, issues:write sozinho retornou 403
    # "Resource not accessible by integration" mesmo com a auditoria concluída.
    # Este job confiável continua sem qualquer passo de merge, close, label ou
    # edição de branch; o write é usado somente para tornar o parecer visível.
    # A leitura do rótulo/corpo da PR continua sendo apenas dado, nunca código.
    # actions:write (Issue #259 — antes só :read) é exigido por DOIS usos:
    # (a) baixar artifact de OUTRA execução (actions/download-artifact@v4
    # com run-id do Guard observado, abaixo) — achado original do "ACHADO
    # ADICIONAL"/"PACOTE CONSOLIDADO" (PR #97): permissão omitida vira
    # 'none'; (b) o novo passo final "Acionar o Worker Bridge
    # explicitamente", que chama actions.createWorkflowDispatch — só
    # write habilita isso (write inclui read, então (a) continua
    # funcionando). Este job continua sem criar/apagar artifact — só
    # consome o que o Guard já publicou e dispara UM workflow_dispatch
    # explícito, nunca cancela/reexecuta run alheio.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      # V3 (Issue #99) — só para postar o Cartão de Merge como comentário
      # quando a auditoria ativa-supervisionada produzir um (ver o passo
      # "Comentar o Cartão de Merge" abaixo). Nunca usado para fechar,
      # reabrir, rotular ou apagar nada — privilégio mínimo.
      issues: write
    steps:
      - name: Checkout (SEMPRE a branch padrão — nunca o HEAD de um PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirmar os portões em código (camada 2, defesa em profundidade)
        env:
          REPASSO_COORDINATOR_ENABLED: ${{ vars.REPASSO_COORDINATOR_ENABLED }}
          REPASSO_COORDINATOR_MODE: ${{ vars.REPASSO_COORDINATOR_MODE }}
          REPASSO_COORDINATOR_PILOT: ${{ vars.REPASSO_COORDINATOR_PILOT }}
          # F8-A: só informativo aqui — as MESMAS Variables/regras que
          # coordinator-runner.yml já usa, nunca uma flag nova. O portão do
          # Runner fechado (o padrão em produção) NUNCA falha este job — só
          # significa que nenhuma retomada api_runner automática acontece.
          REPASSO_RUNNER_ENABLED: ${{ vars.REPASSO_RUNNER_ENABLED }}
          REPASSO_RUNNER_MODE: ${{ vars.REPASSO_RUNNER_MODE }}
          REPASSO_RUNNER_CANARY_TASK_ID: ${{ vars.REPASSO_RUNNER_CANARY_TASK_ID }}
          REPASSO_RUNNER_ACTUAL_REF: ${{ github.ref }}
          REPASSO_RUNNER_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          python3 -c "
          from coordinator.config import Config
          cfg = Config.from_env()
          gate = cfg.gate()
          print(f'Portão ENABLED/MODE: {\"ABERTO\" if gate.open else \"FECHADO\"} — {gate.reason}')
          print(f'Modo PILOTO: {\"ATIVO\" if cfg.pilot else \"inativo\"}')

          from coordinator.runner_dispatch import RunnerDispatchConfig
          runner_gate = RunnerDispatchConfig.from_env().gate()
          print(f'Portão do Runner (retomada automática via SET_AVAILABLE): {\"ABERTO\" if runner_gate.open else \"FECHADO\"} — {runner_gate.reason}')
          "

      - name: Instalar o SDK da Anthropic (só dentro deste job condicionado)
        run: pip install -q -r coordinator/requirements.txt

      - name: Resolver a execução do Guard observada (Issue #259 — API, nunca confia só no input)
        id: guardrun
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          # O input entra por env var, nunca interpolado dentro do script,
          # e é validado por regex antes de qualquer uso — mesmo padrão do
          # `pr_number` de guard.yml.
          GUARD_RUN_ID_INPUT: ${{ inputs.guard_run_id }}
        with:
          # Achado da auditoria independente (Issue #264, comentário
          # #5822771107): race condition real. O passo "Acionar o OBSERVE
          # explicitamente" de guard.yml dispara ESTE dispatch de DENTRO
          # do último passo da própria execução do Guard — nesse instante
          # exato, o run do Guard, por definição, ainda não pode estar
          # `completed` (só vira `completed` depois que TODOS os passos,
          # incluindo o próprio dispatch, terminam). Uma checagem única e
          # imediata de `status === 'completed'` falhava fechado por
          # timing, não por um problema real.
          #
          # Corrigido com retry CURTO e LIMITADO (nunca polling infinito)
          # em resolve_guard_run.mjs — função pura, testada de verdade
          # com fetch/relógio falsos em resolve_guard_run.test.mjs (7
          # casos, incluindo exatamente "in_progress no primeiro fetch,
          # completed no segundo" e o teto do retry nunca sendo
          # ultrapassado). Este passo só injeta as dependências REAIS
          # (github.rest.actions.getWorkflowRun, setTimeout) — toda a
          # decisão vive no módulo testável.
          script: |
            const fs = require('fs');
            const path = require('path');
            const { resolverExecucaoDoGuard } = await import(
              path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/scripts/resolve_guard_run.mjs')
            );
            const bruto = String(process.env.GUARD_RUN_ID_INPUT || '').trim();
            if (!/^[0-9]{1,15}$/.test(bruto)) {
              core.setFailed('guard_run_id inválido — só dígitos são aceitos. Nada foi observado.');
              return;
            }
            const runId = Number(bruto);
            const resultado = await resolverExecucaoDoGuard({
              runId,
              nomeEsperado: 'Repasso Guard',
              branchEsperada: context.payload.repository.default_branch,
              buscarRun: async (id) => {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: id,
                });
                return data;
              },
              dormir: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
              logInfo: core.info,
            });
            if (!resultado.ok) {
              core.setFailed(resultado.motivo);
              return;
            }
            const run = resultado.run;
            // Mesmo formato de payload que o GitHub já entrega no evento
            // `workflow_run` real — o passo seguinte e coordinator/
            // github_event.py::_from_workflow_run tratam os dois gatilhos
            // de forma idêntica a partir daqui, incluindo o filtro de
            // GUARD_CONCLUSOES_SEM_VEREDITO (cancelled/skipped/
            // action_required/neutral/stale), que já é feito EM CÓDIGO,
            // não neste script — ver o comentário da Camada 7 no `if:`
            // deste job.
            const synthetic = {
              action: 'completed',
              workflow_run: {
                id: run.id,
                name: run.name,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                pull_requests: run.pull_requests || [],
              },
            };
            fs.writeFileSync('/tmp/workflow-run-event.json', JSON.stringify(synthetic), 'utf8');
            core.setOutput('run_id', String(run.id));
            core.info(`Guard run ${runId} resolvido pela API: conclusão=${run.conclusion}, HEAD=${run.head_sha}.`);

      - name: Baixar o audit-pack e contexto tipado do Guard
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        continue-on-error: true # runs antigos podem não ter o contexto #165
        uses: actions/download-artifact@v4
        with:
          name: repasso-guard-audit-pack
          path: /tmp/guard-audit-pack
          run-id: ${{ github.event.workflow_run.id || steps.guardrun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buscar dados reais da PR associada (API + contexto tipado — #165)
        id: prctx
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Issue #259: nos dois gatilhos, ``run`` tem o MESMO formato —
            // ou o payload real do webhook, ou o equivalente sintetizado
            // pelo passo "Resolver a execução do Guard observada" a partir
            // da API (nunca do input cru). Todo o resto deste script
            // continua idêntico nos dois casos.
            const run = context.eventName === 'workflow_run'
              ? context.payload.workflow_run
              : JSON.parse(fs.readFileSync('/tmp/workflow-run-event.json', 'utf8')).workflow_run;
            const prs = run.pull_requests || [];
            const contextPath = '/tmp/guard-audit-pack/guard-pr-context.json';
            let typed = null;
            if (fs.existsSync(contextPath)) {
              try {
                typed = JSON.parse(fs.readFileSync(contextPath, 'utf8'));
              } catch (e) {
                console.log('contexto tipado do Guard ilegível — fallback somente para pull_requests do webhook.');
              }
            }

            let numero = null;
            if (prs.length > 0) {
              numero = Number(prs[0].number);
            } else if (typed && Number.isInteger(Number(typed.pr_number))) {
              numero = Number(typed.pr_number);
              console.log(`workflow_run.pull_requests vazio; usando PR #${numero} do artifact tipado do Guard.`);
            } else {
              console.log('workflow_run sem PR associada e sem contexto tipado — nenhuma auditoria semântica será tentada.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: numero,
            });

            const esperadoRepo = `${context.repo.owner}/${context.repo.repo}`;
            const headRepo = pr.head && pr.head.repo ? pr.head.repo.full_name : null;
            if (pr.state !== 'open' || headRepo !== esperadoRepo) {
              console.log(`PR #${numero} não é PR aberta same-repo — auditoria semântica recusada fail-closed.`);
              return;
            }

            if (typed) {
              const contextoConfere =
                Number(typed.pr_number) === pr.number &&
                String(typed.base_ref || '') === String(pr.base.ref || '') &&
                String(typed.head_sha || '') === String(pr.head.sha || '') &&
                String(typed.head_repo_full_name || '') === String(headRepo || '');
              if (!contextoConfere) {
                console.log(`Contexto do Guard não confere com a PR #${numero} real da API — auditoria recusada fail-closed.`);
                return;
              }
            }

            fs.writeFileSync('/tmp/pr-info.json', JSON.stringify({
              number: pr.number,
              title: pr.title,
              body: pr.body,
              labels: pr.labels.map(l => l.name),
              updated_at: pr.updated_at,
              head_sha: pr.head.sha,
              worker_bridge_needs_audit: Boolean(typed && typed.worker_bridge_needs_audit === true),
            }));
            console.log(`PR #${numero}: contexto validado; worker_bridge_needs_audit=${Boolean(typed && typed.worker_bridge_needs_audit === true)}.`);

            // O corpo da PR é declaração; o diff real é a evidência principal.
            const diffResp = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: numero,
              mediaType: { format: 'diff' },
            });
            const diffTexto = typeof diffResp.data === 'string' ? diffResp.data : '';
            fs.writeFileSync('/tmp/pr-diff.patch', diffTexto);
            console.log(`Diff real da PR #${numero}: ${diffTexto.length} caracteres.`);

            // Evidência auxiliar limitada do HEAD EXATO auditado. Nunca executa
            // código da PR: lê somente texto via Contents API no pr.head.sha.
            // O objetivo é permitir ao auditor confirmar que algo removido do
            // diff já está preservado em seção útil do arquivo (caso real #208).
            // Issue #275: o contexto é ANCORADO NA REGIÃO DO DIFF (hunk →
            // seção ancestral → subseções da mesma seção com termos raros),
            // nunca na primeira ocorrência global de uma palavra — em
            // matérias de ~700 KB, "verdadero"/"respuesta" aparecem centenas
            // de vezes e o auditor recebia outro bloco (caso real #266).
            // Toda a decisão vive em head_context.mjs (função pura, testada
            // em head_context.test.mjs); este passo só lê os arquivos do
            // HEAD exato pela API. O módulo vem do checkout da branch
            // padrão (passo "Checkout" acima) — nunca do HEAD da PR.
            const path = require('path');
            const { montarContextoHead } = await import(
              path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/scripts/head_context.mjs')
            );

            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: numero,
              per_page: 100,
            });
            const candidates = changed
              .map(f => f.filename)
              .filter(name => name.includes('/materias-privadas/') && name.endsWith('.html'))
              .slice(0, 3);

            const arquivosHead = [];
            for (const filename of candidates) {
              try {
                const { data: file } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filename,
                  ref: pr.head.sha,
                });
                if (!file || Array.isArray(file) || file.type !== 'file' || file.encoding !== 'base64' || !file.content) {
                  continue;
                }
                arquivosHead.push({
                  filename,
                  content: Buffer.from(file.content.replace(/\n/g, ''), 'base64').toString('utf8'),
                });
              } catch (e) {
                console.log(`Contexto HEAD: não foi possível ler ${filename}; seguindo sem esse trecho.`);
              }
            }
            const headContext = montarContextoHead({
              diffTexto,
              arquivos: arquivosHead,
              sha: pr.head.sha,
              limite: 7000,
            }).slice(0, 7000);
            if (headContext) {
              fs.writeFileSync('/tmp/pr-head-context.txt', headContext);
              console.log(`Contexto limitado do HEAD da PR #${numero}: ${headContext.length} caracteres.`);
            }

      - name: Rodar o Coordinator sobre o evento real
        id: coordinator
        env:
          # Único lugar que a chave existe: o GitHub Secret, exposto só
          # como variável de ambiente deste passo — nunca em código, nunca
          # logada (coordinator/anthropic_transport.py só lê de env, e
          # coordinator/redact.py sanitiza qualquer eco em erro).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issue #130: usado somente pelo Error Registry para abrir/atualizar
          # Issues de falha. Este passo sempre executa codigo da branch padrao.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Os portões precisam chegar até AQUI — é este passo que de fato
          # chama Config.from_env() dentro de `python3 -m coordinator`.
          # Passo de verificação acima lê as mesmas Variables só para
          # imprimir; sem repetir aqui, o processo real veria os defaults
          # seguros (false/observe) mesmo que José tivesse ligado de
          # verdade — o que tornaria o primeiro teste real impossível.
          REPASSO_COORDINATOR_ENABLED: ${{ vars.REPASSO_COORDINATOR_ENABLED }}
          REPASSO_COORDINATOR_MODE: ${{ vars.REPASSO_COORDINATOR_MODE }}
          REPASSO_COORDINATOR_PILOT: ${{ vars.REPASSO_COORDINATOR_PILOT }}
          REPASSO_COORDINATOR_PILOT_EVENT_KEY: ${{ vars.REPASSO_COORDINATOR_PILOT_EVENT_KEY }}
          # OpenAI Auditor (Issue #106) — mesma trava de sempre: o secret só
          # existe como env DESTE passo confiável (branch padrão, nunca o
          # HEAD de um PR — ver o comentário no topo do arquivo), nunca em
          # código, nunca logado (coordinator/openai_transport.py só lê de
          # env, e coordinator/redact.py sanitiza qualquer eco em erro,
          # inclusive chaves no formato "sk-..." da OpenAI). Portão
          # INDEPENDENTE do REPASSO_COORDINATOR_*: REPASSO_OPENAI_AUDITOR_
          # ENABLED continua "false" em produção (valor de hoje) — ligar
          # isto aqui só entrega o dado ao processo; quem decide se uma
          # chamada acontece é sempre coordinator/openai_config.py::
          # OpenAIAuditorConfig.gate(), checado de novo em código.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPASSO_OPENAI_AUDITOR_ENABLED: ${{ vars.REPASSO_OPENAI_AUDITOR_ENABLED }}
          REPASSO_OPENAI_AUDITOR_MODEL: ${{ vars.REPASSO_OPENAI_AUDITOR_MODEL }}
          REPASSO_OPENAI_AUDITOR_HIGH_RISK_MODEL: ${{ vars.REPASSO_OPENAI_AUDITOR_HIGH_RISK_MODEL }}
          REPASSO_OPENAI_AUDITOR_BUDGET_USD: ${{ vars.REPASSO_OPENAI_AUDITOR_BUDGET_USD }}
          # F8-A (Issue #105, Fase F, 7ª rodada): os MESMOS 5 portões que
          # coordinator-runner.yml já usa precisam chegar até AQUI — é este
          # passo que de fato chama RunnerDispatchConfig.from_env() dentro
          # de `python3 -m coordinator` (via `_observar()`). O passo de
          # confirmação acima lê as mesmas Variables só para imprimir; sem
          # repetir aqui, uma retomada api_runner real nunca veria o portão
          # aberto mesmo que José tivesse ligado de verdade. Nenhuma flag
          # nova é ligada por este workflow — os valores vêm só das MESMAS
          # Variables/expressões do Runner.
          REPASSO_RUNNER_ENABLED: ${{ vars.REPASSO_RUNNER_ENABLED }}
          REPASSO_RUNNER_MODE: ${{ vars.REPASSO_RUNNER_MODE }}
          REPASSO_RUNNER_CANARY_TASK_ID: ${{ vars.REPASSO_RUNNER_CANARY_TASK_ID }}
          REPASSO_RUNNER_ACTUAL_REF: ${{ github.ref }}
          REPASSO_RUNNER_EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set +e
          # Remoto com o GITHUB_TOKEN embutido, só para dar push na branch
          # de estado dedicada (contents:write acima). O GitHub mascara
          # automaticamente qualquer log que contenha secrets.GITHUB_TOKEN;
          # como reforço adicional, qualquer erro de git que ecoasse esta
          # URL também passa por coordinator/redact.py antes de aparecer em
          # qualquer resultado (ver test_redact_masks_url_embedded_credential).
          REMOTO_COM_TOKEN="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Issue #259: o caminho workflow_dispatch não tem um evento
          # "workflow_run" de verdade em github.event_path (o payload ali é
          # {inputs, ref, ...} do próprio workflow_dispatch) — usa o
          # equivalente sintetizado pelo passo "Resolver a execução do
          # Guard observada" a partir da API real, e passa
          # --github-event-name "workflow_run" para que
          # coordinator/github_event.py::_from_workflow_run (já testado
          # extensivamente) trate os dois gatilhos de forma IDÊNTICA a
          # partir daqui — dedup por HEAD+policy incluído.
          GITHUB_EVENT_NAME_EFETIVO="${{ github.event_name }}"
          EVENT_PATH_EFETIVO="${{ github.event_path }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_EVENT_NAME_EFETIVO="workflow_run"
            EVENT_PATH_EFETIVO="/tmp/workflow-run-event.json"
          fi

          ARGS=(
            --github-event-name "$GITHUB_EVENT_NAME_EFETIVO"
            --event "$EVENT_PATH_EFETIVO"
            --repo "${{ github.repository }}"
            --dedup-git-remote "$REMOTO_COM_TOKEN"
            --usage-git-remote "$REMOTO_COM_TOKEN"
            --workers-from-tasks-json coordination/tasks.json
            --worker-state-git-remote "$REMOTO_COM_TOKEN"
            --error-state-git-remote "$REMOTO_COM_TOKEN"
            --openai-usage-git-remote "$REMOTO_COM_TOKEN"
            --runner-repo-dir .
            --out /tmp/coordinator-observe.json
            --comment-out /tmp/coordinator-comment.md
            --comment-target-out /tmp/coordinator-comment-target.txt
          )
          [ -f /tmp/pr-info.json ] && ARGS+=(--pr-info-file /tmp/pr-info.json)
          [ -f /tmp/guard-audit-pack/guard-audit-pack.json ] && ARGS+=(--guard-audit-pack /tmp/guard-audit-pack/guard-audit-pack.json)
          [ -s /tmp/pr-diff.patch ] && ARGS+=(--pr-diff-file /tmp/pr-diff.patch)
          [ -s /tmp/pr-head-context.txt ] && ARGS+=(--pr-head-context-file /tmp/pr-head-context.txt)

          python3 -m coordinator "${ARGS[@]}"
          echo "resultado=$?" >> "$GITHUB_OUTPUT"

          # Correção B1 da auditoria independente do PR #104, rodada 4:
          # a função hashFiles() (linguagem de expressão do Actions) só
          # enxerga arquivos dentro de GITHUB_WORKSPACE — /tmp fica FORA
          # disso, então usá-la contra um caminho de /tmp no `if:` do passo
          # seguinte avaliaria sempre como string vazia em produção
          # (comentário nunca seria publicado, apesar de todos os testes
          # locais/estruturais passarem, já que nenhum deles executa um
          # runner real do Actions). O bash comum, ao contrário dessa
          # função, lê /tmp sem problema — então é aqui, ainda em bash, que
          # a existência dos dois arquivos é checada e publicada como
          # output explícito para o próximo passo consultar.
          if [ -s /tmp/coordinator-comment.md ] && [ -s /tmp/coordinator-comment-target.txt ]; then
            echo "comment_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar o resultado OBSERVE como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repasso-coordinator-observe
          path: /tmp/coordinator-observe.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Comentar o Cartão de Merge/checkpoint (V3, Issue #99)
        # Só existe quando o CLI de fato gravou --comment-out E
        # --comment-target-out juntos (MODE=active-supervised e o evento
        # produziu um Cartão de Merge/checkpoint COM destino conhecido —
        # ver coordinator/observe.py). Em MODE=observe (produção hoje)
        # nenhum dos dois arquivos é criado, então este passo é sempre
        # pulado — comportamento V2 inalterado.
        #
        # Correção B4 da auditoria independente do PR #104, rodada 4: o
        # destino NUNCA é inferido aqui — o Coordinator já decidiu (ex.:
        # um POOL-PAUSADO sempre vai para a Inbox #88, mesmo quando o
        # checkpoint que o disparou chegou em outra issue; um checkpoint
        # específico volta para a issue de origem; um Cartão de Merge vai
        # para a PR) e gravou o número em
        # /tmp/coordinator-comment-target.txt. Este passo só lê esse
        # arquivo — nunca reconstrói a lógica de destino em JavaScript.
        #
        # Correção B1 da auditoria independente do PR #104, rodada 4: a
        # função hashFiles() do Actions não enxerga /tmp (fica fora de
        # GITHUB_WORKSPACE) — o `if:` abaixo antes chamava essa função
        # contra um caminho de /tmp e por isso provavelmente NUNCA era
        # verdadeiro em produção. Agora o `if:` consulta o output explícito
        # `comment_ready`, gravado em bash pelo passo "Rodar o Coordinator"
        # (bash lê /tmp normalmente — só aquela função da linguagem de
        # expressão do Actions é restrita ao workspace). `fs.existsSync`
        # abaixo continua como segunda camada de segurança dentro do
        # próprio script.
        if: always() && steps.coordinator.outputs.comment_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/coordinator-comment.md') || !fs.existsSync('/tmp/coordinator-comment-target.txt')) {
              console.log('Arquivo de comentário/destino ausente apesar de comment_ready=true — nada publicado.');
              return;
            }
            const corpo = fs.readFileSync('/tmp/coordinator-comment.md', 'utf8');
            const issueNumber = parseInt(fs.readFileSync('/tmp/coordinator-comment-target.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(issueNumber)) {
              console.log('Destino do comentário inválido/ilegível — nada publicado.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: corpo,
            });
            console.log(`Comentário publicado na issue/PR #${issueNumber}.`);

      - name: Falhar o job se o Coordinator terminou com erro (bloqueador 7)
        if: steps.coordinator.outputs.resultado != '0'
        run: |
          echo "O Coordinator terminou com código ${{ steps.coordinator.outputs.resultado }} — ver o artifact/log publicado acima."
          exit 1

      - name: Acionar o Worker Bridge explicitamente (Issue #259)
        # Mesma razão do passo equivalente em guard.yml, um nível abaixo
        # na cadeia: quando ESTE OBSERVE foi ele mesmo iniciado por
        # workflow_dispatch (o caminho novo deste Issue #259), sua
        # conclusão fica marcada pela mesma restrição de anti-recursão do
        # GITHUB_TOKEN — o listener `workflow_run` de
        # coordinator-worker-bridge.yml para "Repasso Coordinator
        # (OBSERVE)" nunca dispararia. O listener `workflow_run` continua
        # existindo sem nenhuma mudança (funciona quando este OBSERVE foi
        # acionado pelo caminho antigo, sem GITHUB_TOKEN no meio); este
        # passo garante o mesmo resultado nos dois casos.
        #
        # `success()` só é verdadeiro depois do passo "Falhar o job se o
        # Coordinator terminou com erro" acima não ter falhado — ou seja,
        # o MESMO critério que o `workflow_run.conclusion == 'success'` já
        # exigido no `if:` do job `bridge` de coordinator-worker-bridge.yml.
        #
        # Sem input: coordinator-worker-bridge.yml já aceita
        # `workflow_dispatch: {}` sem nenhum campo — o Bridge decide
        # sozinho, lendo o estado real da fila, exatamente como o
        # "Run workflow" manual já funciona hoje. O `if:` do job `bridge`
        # exige `github.actor == 'github-actions[bot]' && MODE ==
        # 'active-supervised'` para este caminho automático (a entrada
        # manual humana, `github.actor == 'Repassomed'`, continua igual,
        # sem exigir active-supervised — nada muda para o piloto).
        #
        # SEM LOOP: este passo só aciona coordinator-worker-bridge.yml,
        # nunca este próprio coordinator-observe.yml nem guard.yml — a
        # cadeia continua estritamente Guard -> OBSERVE -> Bridge, nunca
        # ao contrário (ver o teste estrutural que prova isso). O Bridge
        # pode, por si só, despachar um Guard NOVO para uma tarefa
        # diferente mais adiante — isso já existia, é o funcionamento
        # normal da fila, e cada rodada tem sua própria identidade de
        # dedup (PR/HEAD diferentes), nunca repetindo a MESMA auditoria.
        # NUNCA pode virar o resultado do OBSERVE: disparar o próximo elo
        # é efeito colateral best-effort. `continue-on-error: true`
        # (mesmo achado ao vivo do passo equivalente em guard.yml, PR
        # #264: uma falha aqui sem essa trava viraria "failure" NESTE
        # próprio job — e o listener `workflow_run` do Bridge só aceita
        # conclusão "success", então corromperia o próprio sinal que a
        # rede de segurança depende para funcionar).
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'coordinator-worker-bridge.yml',
                ref: context.payload.repository.default_branch,
              });
              core.info('Worker Bridge acionado explicitamente por workflow_dispatch após o OBSERVE.');
            } catch (e) {
              core.warning(
                `Dispatch explícito do Worker Bridge falhou (${e.message || e}) — o listener workflow_run ` +
                'continua como rede de segurança; o resultado deste OBSERVE não muda por causa disso.'
              );
            }
