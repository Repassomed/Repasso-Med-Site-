name: Repasso Quality Scan (READ-ONLY)

# Caça-erros global: lê matérias, usa a OpenAI (Terra) como analisador
# principal e o Claude Haiku só como segundo revisor dos achados incertos
# (0 chamada se não houver dúvida), e escreve SOMENTE o painel
# coordination/quality/ numa branch/PR dedicada. Nunca corrige matéria,
# nunca faz merge/deploy e nunca escreve Supabase/Auth/pagamento.

on:
  # Rodada final 30/09/2026: manual-only para preservar o saldo baixo da
  # Anthropic. José/ChatGPT dispara quando quiser avançar a auditoria.
  workflow_dispatch:
    inputs:
      subject:
        description: "Slug opcional da matéria (vazio = próxima menos auditada)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repasso-quality-scan
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main confiável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar clientes oficiais já usados pelo projeto
        run: pip install -q -r coordinator/requirements.txt

      - name: Preparar branch única do painel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "repasso-quality-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin quality/global-site-findings:refs/remotes/origin/quality/global-site-findings || true
          if git show-ref --verify --quiet refs/remotes/origin/quality/global-site-findings; then
            git checkout -B quality/global-site-findings origin/quality/global-site-findings
            git merge --no-edit origin/${{ github.event.repository.default_branch }}
          else
            git checkout -b quality/global-site-findings origin/${{ github.event.repository.default_branch }}
          fi

      # Etapas A+B: scans estáticos (zero API) + OpenAI (analisador PRINCIPAL,
      # até 2 chunks). Aqui só existe OPENAI_API_KEY. Falha/JSON inválido =
      # falha fechada: nada é escrito nem publicado.
      - name: OpenAI — análise principal da matéria
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPASSO_QUALITY_OPENAI_MODEL: gpt-5.6-terra
          SUBJECT_INPUT: ${{ inputs.subject }}
        run: |
          set -euo pipefail
          SUBJECT="${SUBJECT_INPUT:-}"
          if [ -n "$SUBJECT" ]; then
            python3 -m coordinator.site_quality_scan --stage openai --subject "$SUBJECT"
          else
            python3 -m coordinator.site_quality_scan --stage openai
          fi

      # Etapa C: Claude Haiku (FAST) só recebe os achados que a OpenAI marcou
      # NEEDS_SECOND_OPINION (nunca a matéria). 0 chamada se não houver
      # incerto; no máximo 1, sem retry. Aqui só existe ANTHROPIC_API_KEY.
      # Falha do Claude não derruba o relatório da OpenAI.
      - name: Claude Haiku — somente achados incertos (0 ou 1 chamada)
        if: steps.openai.outputs.needs_claude == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPASSO_QUALITY_CLAUDE_MODEL: claude-haiku-4-5-20251001
        run: |
          set -euo pipefail
          python3 -m coordinator.site_quality_scan --stage claude

      # Consolida e escreve SOMENTE coordination/quality/. Nenhuma chave de API.
      - name: Consolidar painel (sem chaves)
        run: |
          set -euo pipefail
          python3 -m coordinator.site_quality_scan --stage finalize

      - name: Publicar somente o painel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Defesa em profundidade: nem diff já commitado nem working tree
          # podem conter matéria. Só coordination/quality/ pode ser escrita.
          if { git diff --name-only origin/${{ github.event.repository.default_branch }}...HEAD; git diff --name-only; } | \
             grep '^Repasso-Med-Site--main/Atual - Copia/netlify/functions/materias-privadas/' | grep -q .; then
            echo "BLOQUEADO: a branch do painel alterou matéria." >&2
            exit 1
          fi
          EXTRA="$(git status --porcelain | awk '{print $2}' | grep -v '^coordination/quality/' || true)"
          if [ -n "$EXTRA" ]; then
            echo "BLOQUEADO: scanner tentou escrever fora de coordination/quality/:" >&2
            echo "$EXTRA" >&2
            exit 1
          fi

          git add coordination/quality/global-findings.json coordination/quality/global-findings.md
          if git diff --cached --quiet; then
            echo "Painel sem mudança."
          else
            git commit -m "audit: atualizar painel global de erros"
            git push origin HEAD:quality/global-site-findings
          fi

          PR_NUM="$(gh pr list --head quality/global-site-findings --base '${{ github.event.repository.default_branch }}' --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUM" ]; then
            gh pr create \
              --base '${{ github.event.repository.default_branch }}' \
              --head quality/global-site-findings \
              --title '[AUDIT] Painel contínuo de erros globais — NÃO MERGEAR' \
              --body $'PR viva de auditoria.\n\n- Somente registra achados em `coordination/quality/`.\n- Claude procura; OpenAI faz segunda revisão.\n- Nenhuma matéria é corrigida nesta PR.\n- Nenhum merge/deploy automático.\n- José/ChatGPT decide quais achados viram tarefas separadas.\n\n**NÃO MERGEAR esta PR enquanto ela estiver sendo usada como painel contínuo.**'
          else
            echo "Painel já aberto na PR #$PR_NUM"
          fi
