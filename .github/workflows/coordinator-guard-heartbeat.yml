name: Repasso Guard Heartbeat

# Agendamento independente para quebrar a cadeia Guard -> OBSERVE -> Bridge.
# Não executa código de PR, não recebe chaves de modelos e despacha no
# máximo um Guard por rodada. O Guard concluído aciona OBSERVE via workflow_run.
on:
  schedule:
    # Minutos fora dos horários de pico; o schedule do GitHub não é
    # garantido (0 execuções medidas entre 14:42 e 16:40 UTC de 24/09).
    - cron: "19,49 * * * *"
  # Merge na branch padrão: cadeia nova, sem o limite de profundidade de
  # workflow_run que impede o Guard despachado pelo Bridge de acionar o
  # OBSERVE. Só a branch padrão; o código é sempre o da main.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard_reconcile:
    # Este job nunca recebe Anthropic/OpenAI, nunca faz checkout e nunca
    # executa código de PR. Só roda do workflow confiável da main e só
    # despacha guard.yml (constante) para uma PR Worker Bridge aberta que
    # ainda não recebeu o marcador do Coordinator.
    #
    # Justiça da fila: uma PR cujo Guard já REPROVOU no HEAD atual é
    # considerada bloqueada e é pulada. Ela só volta a ser elegível quando
    # o HEAD muda, evitando que uma pendência objetiva monopolize todos os
    # heartbeats e atrase as PRs seguintes.
    if: >
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      vars.REPASSO_COORDINATOR_ENABLED == 'true' &&
      vars.REPASSO_COORDINATOR_MODE == 'active-supervised'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Reconciliar uma PR NEEDS-AUDIT sem Cartão de Merge
        uses: actions/github-script@v7
        with:
          script: |
            const markerBridge = '<!-- repasso-worker-bridge-needs-audit -->';
            const markerCoordinator = '<!-- repasso-coordinator -->';
            const markerGuard = '<!-- repasso-guard-resumo -->';
            const auditPolicyVersion = '2026-09-24-material-scope-head-context-v1';
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: context.payload.repository.default_branch,
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });

            for (const pr of pulls) {
              const body = String(pr.body || '');
              if (!body.includes(markerBridge)) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const cards = comments.filter(c => String(c.body || '').includes(markerCoordinator));
              if (cards.length) {
                // Um cartão de outro HEAD não conclui a auditoria deste commit.
                // Cartões antigos sem SHA explícito são vinculados pela data do commit.
                const { data: headCommit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });
                const headDateText =
                  (headCommit.commit && headCommit.commit.committer && headCommit.commit.committer.date) ||
                  (headCommit.commit && headCommit.commit.author && headCommit.commit.author.date) ||
                  '';
                const headCommittedAt = Date.parse(headDateText);
                const cardForCurrentHeadAndPolicy = cards.some(c => {
                  const card = String(c.body || '');
                  const policy = card.match(/\*\*Política de auditoria:\*\*\s*`([^`]+)`/i);
                  if (!policy || policy[1] !== auditPolicyVersion) return false;

                  const audited = card.match(/\*\*HEAD auditado:\*\*\s*`([0-9a-f]{40})`/i);
                  if (audited) return audited[1].toLowerCase() === pr.head.sha.toLowerCase();
                  const cardAt = Date.parse(String(c.created_at || ''));
                  return Number.isFinite(headCommittedAt) &&
                    Number.isFinite(cardAt) && cardAt >= headCommittedAt;
                });
                if (cardForCurrentHeadAndPolicy) continue;
                core.info(
                  `PR #${pr.number}: falta cartão para HEAD ${pr.head.sha} ` +
                  `na política ${auditPolicyVersion}; Guard será redisparado.`
                );
              }

              const headRepo = pr.head && pr.head.repo ? pr.head.repo.full_name : '';
              const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
              if (
                pr.state !== 'open' ||
                pr.base.ref !== context.payload.repository.default_branch ||
                headRepo !== expectedRepo
              ) {
                continue;
              }

              // Se o último Guard já reprovou ESTE MESMO HEAD, não adianta
              // redispará-lo a cada heartbeat. Pula para a próxima PR e só
              // reabilita esta quando houver commit novo no HEAD.
              const guardComments = comments
                .filter(c => String(c.body || '').includes(markerGuard))
                .sort((a, b) => String(a.updated_at || a.created_at || '')
                  .localeCompare(String(b.updated_at || b.created_at || '')));
              const latestGuard = guardComments.length ? guardComments[guardComments.length - 1] : null;
              if (latestGuard && String(latestGuard.body || '').includes('🔴 REPROVADO')) {
                const { data: headCommit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });
                const headDateText =
                  (headCommit.commit && headCommit.commit.committer && headCommit.commit.committer.date) ||
                  (headCommit.commit && headCommit.commit.author && headCommit.commit.author.date) ||
                  '';
                const headCommittedAt = Date.parse(headDateText);
                const latestGuardAt = Date.parse(String(latestGuard.updated_at || latestGuard.created_at || ''));
                const blockedOnCurrentHead =
                  Number.isFinite(headCommittedAt) &&
                  Number.isFinite(latestGuardAt) &&
                  latestGuardAt >= headCommittedAt;

                if (blockedOnCurrentHead) {
                  core.info(
                    `Reconciliação: PR #${pr.number} está bloqueada pelo Guard no HEAD ${pr.head.sha}; ` +
                    'pulando para a próxima PR até o HEAD mudar.'
                  );
                  continue;
                }
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'guard.yml',
                ref: context.payload.repository.default_branch,
                inputs: { pr_number: String(pr.number) },
              });
              core.info(
                `Reconciliação: Guard redisparado da main para PR #${pr.number}; ` +
                'uma única PR elegível por heartbeat, sem chamada paga neste job.'
              );
              return;
            }

            core.info('Reconciliação: nenhuma PR Worker Bridge elegível pendente de Cartão de Merge.');

