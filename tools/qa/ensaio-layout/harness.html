  const casa = x => Object.keys(o._eq).every(k => x[k] === undefined || x[k] === o._eq[k]);
  o.then = (res, rej) => { let out; const rows = ler();
    if (o._op === 'insert') { const r = Object.assign({ id: 'ens-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8), created_at: new Date().toISOString() }, o._row);
      if (rows.some(x => x.id === r.id)) out = { data: null, error: { code: '23505', message: 'duplicate key' } }; else { rows.push(r); gravar(rows); out = { data: { id: r.id }, error: null }; }
      window.__writes.push('insert:' + t);
    } else if (o._op === 'delete') { gravar(rows.filter(x => !casa(x))); out = { data: null, error: null }; window.__writes.push('delete:' + t);

  o.then = function(res){ return Promise.resolve({ data: [], error: null }).then(res) }; return o }

window._sb = window.RM_SB;
