<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/assets/styles.css"><title>real-ink</title></head><body>
<div class="main-tabs" id="main-tabs"><div class="main-tabs-inner" id="main-tabs-inner"><button class="main-tab active" data-tab="fisio2">Fisiopatología II</button></div></div>
<div id="materias-container"></div>
<script>
/* Harness de tinta EM POSIÇÃO REAL (PR #481). Site real: app-core.js + rm-tools.js + rm-tools-v2.js (a caneta de verdade).
   Só o servidor é simulado, EM MEMÓRIA: nenhum request de rede, nenhuma escrita em banco. Os INSERTs de traço são capturados em window.__rows;
   os SELECTs devolvem window.__SEED (traços «vindos do banco» de uma sessão anterior). */
const P=new URLSearchParams(location.search); window.__errs=[]; window.__rows=[]; window.__writes=[];
window.addEventListener('error',e=>window.__errs.push(String(e.message)));
window.addEventListener('unhandledrejection',e=>window.__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));
window.RM_CATALOGO=[{slug:'fisiopatologia-ii',tab:'fisio2',title:'Fisiopatología II',sub:''}];
const UID=P.get('uid')||'d4d215d3-36dd-4efb-8869-bdea5376c648';
function chain(t){const o={_op:'select'};['select','eq','order','limit','single','maybeSingle','in'].forEach(m=>o[m]=()=>o);o.range=function(a){o._from=a;return o};
 ['update','delete','upsert'].forEach(m=>o[m]=function(){o._op=m;window.__writes.push(m+':'+t);return o});
 o.insert=function(row){o._op='insert';window.__writes.push('insert:'+t);if(t==='user_ink_strokes')window.__rows.push(JSON.parse(JSON.stringify(row)));o._row=row;return o};
 o.then=function(res){let data=[];if(o._op==='insert')data=o._row?{id:o._row.id}:null;else if(o._op==='select'&&!(o._from>0)&&t==='user_ink_strokes')data=(window.__SEED||[]);return Promise.resolve({data,error:null}).then(res)};return o}
window.RM_SB={auth:{getSession:async()=>({data:{session:{access_token:'tok-test'}}}),getUser:async()=>({data:{user:{id:UID}}}),onAuthStateChange(){return{data:{subscription:{unsubscribe(){}}}}}},from:chain};
</script>
<script src="/assets/app-core.js"></script>
<script src="/assets/rm-tools.js"></script>
<script src="/assets/rm-tools-v2.js"></script>
<script>
(async()=>{
  const t=await (await fetch('/m/'+(P.get('v')||'new')+'.html')).text();
  const doc=new DOMParser().parseFromString(t,'text/html');
  const node=document.importNode(doc.querySelector('[id^="tab-"]'),true);
  document.getElementById('materias-container').appendChild(node);
  RepassoMed.enhanceAll(); switchTab('fisio2');
  await new Promise(r=>setTimeout(r,2500)); window.__ready=true;
})();
</script></body></html>
