<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="assets/styles.css"><!--INDEX_STYLE--><title>harness-ink</title></head><body>
<!--INDEX_TOP-->
<div class="main-tabs" id="main-tabs"><div class="main-tabs-inner" id="main-tabs-inner"><button class="main-tab active">Semiología II</button><button class="main-tab">Biología</button></div></div>
<div id="materias-container"></div>
<button id="logout-fab" type="button">Salir</button>
<script>
const P=new URLSearchParams(location.search);
window.__writes=[];window.__errs=[];
window.addEventListener('error',e=>window.__errs.push(String(e.message)));
window.addEventListener('unhandledrejection',e=>window.__errs.push('rej:'+e.reason));
window.RM_CATALOGO=[{slug:'semiologia-ii',tab:'semio2',title:'Semiología II',sub:'Respiratorio · Cardio · Digestivo'},{slug:'biologia',tab:'bio',title:'Biología',sub:'Biomoléculas'},{slug:'fisiopatologia-ii',tab:'fisio2',title:'Fisiopatología II',sub:''}];
function chain(t){const o={};['select','eq','order','limit','single','maybeSingle','in'].forEach(m=>o[m]=()=>o);o.range=function(a){o._from=a;return o};   /* a V2 (#427) carrega os traços PAGINADOS com .range(início, fim) até vir uma página vazia: só a 1ª página tem dados */['insert','update','delete','upsert'].forEach(m=>o[m]=function(a){window.__writes.push(m+':'+t);return o});o.then=function(res){if(o._from>0) return Promise.resolve({data:[],error:null}).then(res);return Promise.resolve({data:t==='user_ink_strokes'?semear():(t==='user_highlights'&&window.__HL)?window.__HL:[],error:null}).then(res)};return o}
/* tinta SEMEADA (persistida de uma sessão anterior): 1 traço por seção (ou só nas seções de ?seed=id1,id2), no 3º parágrafo longo — calculado com o DOM vivo no momento do SELECT */
/* ?seedmany=N: N traços ESPALHADOS por todos os parágrafos/tabelas/post-its de todas as seções (aluno com a matéria já bem anotada) — carga realista para medir a caneta (#456) */
function semearMuitos(n){ const out=[]; let k=0; const els=[]; document.querySelectorAll('#materias-container section[id]').forEach(sec=>{ [...sec.querySelectorAll('p,li,h2,h3,h4,h5,table,figure,blockquote')].forEach((e,i)=>{ if(e.closest('[data-rm-ui]')) return; if(e.textContent.length>60) els.push([sec.id,i]); }); }); const passo=Math.max(1,Math.floor(els.length/n)); for(let i=0;i<els.length&&out.length<n;i+=passo){ const [sid,ix]=els[i]; out.push({id:'seedm-'+(k++),anchor_id:sid+'>'+ix,color:'#1b3a6b',width:2,points:[[.05,.3],[.2,.6],[.35,.3],[.5,.6],[.65,.3],[.8,.6],[.95,.4]],created_at:'2026-01-01T00:00:00Z'}); } return out; }
function semear(){ if(P.get('seedmany')) return semearMuitos(+P.get('seedmany')); if(!P.get('seed')) return []; const out=[]; const so=(P.get('seed')||'').split(',').filter(x=>x&&x!=='1'); document.querySelectorAll('#materias-container section[id]').forEach((sec,k)=>{ if(so.length&&so.indexOf(sec.id)<0) return; const els=[...sec.querySelectorAll('p,li,h2,h3,h4,h5,table,figure,blockquote')]; const idx=els.findIndex((e,i)=>e.tagName==='P'&&e.textContent.length>150&&i>=2); if(idx<0) return; out.push({id:'seed-'+k,anchor_id:sec.id+'>'+idx,color:'#1b3a6b',width:2,points:[[.1,.5],[.3,.3],[.5,.6],[.7,.4],[.9,.5]],created_at:'2026-01-01T00:00:00Z'}); }); return out; }
window.RM_SB={auth:{getSession:async()=>P.get('nosess')?{data:{session:null}}:({data:{session:{access_token:'tok-test'}}}),getUser:async()=>({data:{user:{id:P.get('uid')||'u-x'}}}),onAuthStateChange(){return{data:{subscription:{unsubscribe(){}}}}}},from:chain};
</script>
<script src="assets/app-core.js"></script>
<script src="assets/rm-tools.js"></script>
<script src="assets/rm-tools-v2.js"></script>
<script src="assets/rm-pilot.js"></script>
<script>
window.openMateria=async function(slug,tab){
  const t=await (await fetch('m/'+slug+'.html')).text();
  const doc=new DOMParser().parseFromString(t,'text/html');
  const node=document.importNode(doc.querySelector('[id^="tab-"]'),true);
  document.getElementById('materias-container').appendChild(node);
  RepassoMed.enhanceAll(); switchTab(tab);
};
(async()=>{ await openMateria(P.get('slug')||'semiologia-ii',P.get('tab')||'semio2'); await new Promise(r=>setTimeout(r,+(P.get('wait')||1500))); window.__ready=true; })();
</script></body></html>
