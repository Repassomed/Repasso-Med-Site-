<div id="materias-container"></div>
<script>
const P=new URLSearchParams(location.search); window.__errs=[];

window.addEventListener('unhandledrejection',e=>window.__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));

</script>
<script src="/assets/app-core.js"></script>

<script>
(async()=>{
  const t=await (await fetch('/m/'+(P.get('v')||'new')+'.html')).text();
  const doc=new DOMParser().parseFromString(t,'text/html');
  const node=document.importNode(doc.querySelector('[id^="tab-"]'),true);
  document.getElementById('materias-container').appendChild(node);
  window.__preEnhance=document.querySelectorAll('.quiz-item').length;
  RepassoMed.enhanceAll(); switchTab('farmaco2');
  await new Promise(r=>setTimeout(r,1200)); window.__ready=true;
})();
