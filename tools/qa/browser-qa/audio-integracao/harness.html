<style id="b1-contract">
/* SNAPSHOT do CONTRATO do Layout V2 B1 (#411/#417) — só o que o audiobook consome; usado quando não há RM_B1_DIR (B1 real). */
html.rm-l2 { --rm-left-w: 0px; --rm-right-w: 0px; --rm-player-w: 224px; --rm-player-h: 0px; --rm-safe-b: env(safe-area-inset-bottom, 0px); }
html.rm-l2[data-rm-lmode="docked"] { --rm-left-w: 264px; }
html.rm-l2[data-rm-lmode="rail"]   { --rm-left-w: 64px; }
html.rm-l2:not([data-rm-lmode="off"]) { --rm-right-w: 67px; }
html.rm-l2 #materias-container { box-sizing: border-box; padding-left: var(--rm-left-w); padding-right: var(--rm-right-w); padding-bottom: calc(var(--rm-player-h) + var(--rm-safe-b)); }
.rm-l2-player { position: fixed; left: var(--rm-left-w, 0px); right: var(--rm-right-w, 0px); bottom: 0; z-index: 99989; height: var(--rm-player-h, 0px); box-sizing: border-box; padding-bottom: var(--rm-safe-b, 0px); }
.rm-l2-player[hidden] { display: none; }
#b1-side, #b1-tools { display: none; }
html.rm-l2 #b1-side { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: var(--rm-left-w); background: #345; z-index: 360; }
/* a toolbox da V2 (.rm2-box): direita, centro; ≤560 px sobe para cima do player (regra do rm-layout.css §8) */
html.rm-l2 #b1-tools { display: block; position: fixed; right: max(9px, env(safe-area-inset-right)); top: 50%; width: 58px; height: 200px; margin-top: -100px; background: #13314f; z-index: 99991; }
@media (max-width: 560px) { html.rm-l2 #b1-tools { width: 52px; height: 150px; margin-top: 0; top: auto; bottom: max(84px, calc(env(safe-area-inset-bottom) + 74px + var(--rm-player-h))); } }
</style>
</head>

<script>
  const SUPABASE_URL = "{{SUPABASE_URL}}";
  window.__sess = new URLSearchParams(location.search).get('real') ? { token: 'tok-jose-real', uid: 'd4d215d3-36dd-4efb-8869-bdea5376c648' } : { token: 'tok-jose', uid: 'uid-jose' };
  /* Banco falso em memória para o rm-tools.js / rm-tools-v2.js REAIS (caneta, marca-texto, anotações): subconjunto do PostgREST que eles usam. */
  window.__db = { user_ink_strokes: [], user_highlights: [], user_notes: [], study_tools_beta: [], user_study_progress: [], my_active_subjects: [{ subject_slug: 'semiologia-ii' }] };
  try { var sv = sessionStorage.getItem('__rmdb'); if (sv) window.__db = JSON.parse(sv); } catch (e) {}      // sobrevive a reload (teste de recarregamento real)
  window.__dbOps = []; window.__dbChaos = { atrasoInsert: 0 };
  window.__dbSave = function () { try { sessionStorage.setItem('__rmdb', JSON.stringify(window.__db)); } catch (e) {} };
  (function () {
    var seq = 0; Object.keys(window.__db).forEach(function (k) { window.__db[k].forEach(function (r) { var m = /^id-(\d+)$/.exec(String(r.id)); if (m) seq = Math.max(seq, +m[1]); }); });
    function Q(t) { this.t = t; this.op = 'select'; this.f = []; this.one = null; this.pay = null; this.lim = Infinity; }
    ['eq', 'in', 'neq'].forEach(function (m) { Q.prototype[m] = function (k, v) { this.f.push([m, k, v]); return this; }; });
    Q.prototype.select = function () { return this; };
    Q.prototype.insert = function (r) { this.op = 'insert'; this.pay = r; return this; };
    Q.prototype.upsert = function (r) { this.op = 'upsert'; this.pay = r; return this; };
    Q.prototype.update = function (r) { this.op = 'update'; this.pay = r; return this; };
    Q.prototype.delete = function () { this.op = 'delete'; return this; };
    Q.prototype.order = function () { return this; };
    Q.prototype.limit = function (n) { this.lim = n; return this; };
    Q.prototype.range = function () { return this; };
    Q.prototype.single = function () { this.one = 'single'; return this; };
    Q.prototype.maybeSingle = function () { this.one = 'maybe'; return this; };
    Q.prototype.match = function (row) { return this.f.every(function (x) { return x[0] === 'eq' ? row[x[1]] === x[2] : x[0] === 'neq' ? row[x[1]] !== x[2] : x[2].indexOf(row[x[1]]) >= 0; }); };
    Q.prototype.then = function (ok, ko) {
      var q = this, tab = window.__db[q.t] || (window.__db[q.t] = []), out, run = function () {
        window.__dbOps.push(q.op + ':' + q.t);
        if (q.op === 'insert' || q.op === 'upsert') { var rows = [].concat(q.pay).map(function (r) { return Object.assign({ id: 'id-' + (++seq) }, r); }); rows.forEach(function (r) { tab.push(r); }); out = rows; }
        else if (q.op === 'delete') { out = tab.filter(q.match, q); window.__db[q.t] = tab.filter(function (r) { return !q.match(r); }); }
        else if (q.op === 'update') { out = tab.filter(q.match, q); out.forEach(function (r) { Object.assign(r, q.pay); }); }
        else out = tab.filter(q.match, q).slice(0, q.lim);
        if (q.op !== 'select') window.__dbSave();
        if (q.one) { if (out.length !== 1) return { data: null, error: q.one === 'maybe' && out.length === 0 ? null : { message: 'rows=' + out.length } }; return { data: out[0], error: null }; }
        return { data: out, error: null };
      };
      var ms = q.op === 'insert' && q.t === 'user_ink_strokes' ? window.__dbChaos.atrasoInsert : 0;
      return new Promise(function (res) { setTimeout(function () { res(run()); }, ms); }).then(ok, ko);
    };
    window.__fromDb = function (t) { return new Q(t); };
  })();
  window.__authL = []; window.__authCb = function (evt) { var s = window.__sess ? { access_token: window.__sess.token, user: { id: window.__sess.uid } } : null; window.__authL.slice().forEach(function (f) { try { f(evt, s); } catch (e) {} }); };
  window.RM_SB = { from: function (t) { return window.__fromDb(t); }, auth: {
    getUser: function () { return Promise.resolve({ data: { user: window.__sess ? { id: window.__sess.uid } : null } }); },
    getSession: function () { return Promise.resolve({ data: { session: window.__sess ? { access_token: window.__sess.token, user: { id: window.__sess.uid } } : null } }); },
    onAuthStateChange: function (cb) { window.__authL.push(cb); return { data: { subscription: { unsubscribe: function () { var k = window.__authL.indexOf(cb); if (k >= 0) window.__authL.splice(k, 1); } } } }; }
  } };
  window.RM_CATALOGO = [{ slug: 'semiologia-ii', tab: 'semio2', title: 'Semiología II', sub: '' }];
  /* ligar a aba do piloto como o site faz */
  (function () { var t = document.getElementById('tab-semio2'); if (t) t.classList.add('active'); })();
</script>

<script>
  /* Stub do Layout V2 (só sem RM_B1_DIR): cria o slot e os atributos como o rm-layout.js faria. */
  if (!window.RMLayout) {
    window.RMLayout = {
      attach: function (tab) {
        var H = document.documentElement; H.classList.add('rm-l2');
        var w = H.clientWidth, lm = w >= 1200 ? 'docked' : (w >= 768 ? 'rail' : 'off');

        H.setAttribute('data-rm-dock', (w - 67 - 8 - 224) >= cardR + 8 ? 'side' : 'bottom');
        if (!document.getElementById('rm-l2-player')) {

          document.body.appendChild(s);
        }
      },
      detach: function () {
        var H = document.documentElement; H.classList.remove('rm-l2'); ['data-rm-lmode', 'data-rm-dock'].forEach(function (a) { H.removeAttribute(a); });
        var s = document.getElementById('rm-l2-player'); if (s) s.remove();
      }
    };
  }
